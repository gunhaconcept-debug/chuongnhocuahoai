<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chuồng nhỏ của Hoài</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="logo">📚 Chuồng nhỏ của Hoài</div>
    <div class="nav">
      <a class="mini" href="https://monkeydd.com/nhom-dich/2837" target="_blank" rel="noopener">🏠 MonkeyD</a>
    </div>
  </div>

  <div class="hero">
    <h1>Truyện • Audio • Góc ủng hộ ❤️</h1>
    <p>Kho truyện của Chuồng nhỏ của Hoài, đồng bộ từ MonkeyD.</p>
  </div>

  <section class="home-section">
    <div class="section-head">
      <h2>🆕 TRUYỆN MỚI NHẤT</h2>
      <span id="syncText">Nguồn: MonkeyD</span>
    </div>
    <div id="newestRail" class="story-rail"></div>
  </section>

  <section class="home-section">
    <div class="section-head">
      <h2>🔥 TRUYỆN CÓ NHIỀU LƯỢT XEM TRONG THÁNG</h2>
    </div>
    <div id="monthlyRail" class="story-rail"></div>
  </section>

  <section class="home-section">
    <div class="section-head list-head">
      <h2>📚 DANH SÁCH TRUYỆN</h2>
      <span id="count">Đang tải...</span>
    </div>

    <div class="filter-panel">
      <input id="search" class="search" placeholder="🔎 Tìm truyện...">
      <select id="genreFilter" class="select">
        <option value="">Chọn thể loại...</option>
      </select>
      <div class="filters">
        <button class="filter active" data-mode="all">Tất cả</button>
        <button class="filter" data-mode="full">✅ FULL</button>
        <button class="filter" data-mode="audio">🎧 Có Audio</button>
      </div>
    </div>

    <div id="list" class="list-grid"></div>
    <div id="pager" class="pager"></div>
  </section>
</div>
<script src="assets/home.js"></script>
</body>
</html>
